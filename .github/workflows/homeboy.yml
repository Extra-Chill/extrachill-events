name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  homeboy:
    name: Homeboy (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [review lint, review test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: homeboy_wptests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout Extra Chill Events
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Data Machine
        uses: actions/checkout@v4
        with:
          repository: Extra-Chill/data-machine
          ref: main
          path: .ci/data-machine

      - name: Checkout Data Machine Events
        uses: actions/checkout@v4
        with:
          repository: Extra-Chill/data-machine-events
          ref: main
          path: .ci/data-machine-events

      - name: Install Data Machine dependencies
        working-directory: .ci/data-machine
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative

      - name: Run Homeboy ${{ matrix.command }}
        env:
          HOMEBOY_SETTINGS_JSON: >-
            {"database_type":"mysql","validation_dependencies":["${{ github.workspace }}/.ci/data-machine","${{ github.workspace }}/.ci/data-machine-events"],"wp_codebox_multisite":true,"wp_codebox_phpunit_bootstrap_mode":"managed"}
          HOMEBOY_WP_CODEBOX_ARTIFACTS_DIR: ${{ github.workspace }}/wp-codebox-artifacts
          HOMEBOY_WORDPRESS_MULTISITE: '1'
        uses: Extra-Chill/homeboy-action@v2
        with:
          commands: ${{ matrix.command }}
          expected-commands: review lint,review test

      - name: Upload managed PHPUnit evidence
        if: ${{ always() && matrix.command == 'review test' }}
        uses: actions/upload-artifact@v4
        with:
          name: managed-phpunit-evidence
          path: wp-codebox-artifacts
          if-no-files-found: error
