name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  homeboy:
    name: Homeboy (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [review lint, review test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: homeboy_wptests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout Extra Chill Events
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout Data Machine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/data-machine
          ref: b4c0ce8906c4870b28cfa6bc3192122ecabb3a89
          path: .ci/data-machine

      - name: Checkout Data Machine Events
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/data-machine-events
          ref: e684ea4dbe7532cd2569f72a586933fe1e4fab51
          path: .ci/data-machine-events

      - name: Checkout Homeboy Extensions adapter fix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/homeboy-extensions
          ref: fff5ce20a21570569feb284f8b3cf7b273ff77dc
          path: .ci/homeboy-extensions

      - name: Install Data Machine dependencies
        working-directory: .ci/data-machine
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative

      - name: Install test dependencies
        if: ${{ matrix.command == 'review test' }}
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run isolated unit tests
        if: ${{ matrix.command == 'review test' }}
        run: |
          vendor/bin/phpunit --configuration phpunit-artist-unit.xml.dist
          vendor/bin/phpunit --configuration phpunit-venue-unit.xml.dist
          vendor/bin/phpunit --configuration phpunit-local-scene-unit.xml.dist

      - name: Select managed WordPress suite
        if: ${{ matrix.command == 'review test' }}
        run: cp phpunit-managed.xml.dist phpunit.xml.dist

      - name: Run Homeboy ${{ matrix.command }}
        env:
          HOMEBOY_SETTINGS_JSON: >-
            {"database_type":"mysql","validation_dependencies":["${{ github.workspace }}/.ci/data-machine","${{ github.workspace }}/.ci/data-machine-events"],"wp_codebox_multisite":true,"wp_codebox_phpunit_bootstrap_mode":"managed"}
          HOMEBOY_WP_CODEBOX_ARTIFACTS_DIR: ${{ github.workspace }}/wp-codebox-artifacts
          HOMEBOY_WORDPRESS_MULTISITE: '1'
        uses: Extra-Chill/homeboy-action@beedc218296bf2b66b04794f669611abf4e7cc7f
        with:
          commands: ${{ matrix.command }}
          extension-source: ${{ github.workspace }}/.ci/homeboy-extensions
          expected-commands: review lint,review test

      - name: Upload managed PHPUnit evidence
        if: ${{ always() && matrix.command == 'review test' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-phpunit-evidence
          path: wp-codebox-artifacts
          if-no-files-found: error
